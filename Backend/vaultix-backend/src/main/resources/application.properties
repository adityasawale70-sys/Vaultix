# ===============================
# DATABASE CONFIGURATION
# ===============================

spring.datasource.url=jdbc:mysql://localhost:3306/vaultix_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Vaultix@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Optional
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================

server.port=8080

# ===============================
# APPLICATION
# ===============================

spring.application.name=Vaultix

# ===============================
# JWT
# ===============================

jwt.secret=Vaultix$ecretKeyForHMAC_SHA256_MinLen32!
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-days=7