# ─── Datasource ───────────────────────────────────────────────────────────────
# Secrets come from environment variables; fallback values are for LOCAL DEV ONLY.
# NEVER commit real credentials here.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaultix_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Vaultix@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
# Dialect is auto-detected — no need to set explicitly
spring.jpa.show-sql=false
# Prevent the open-in-view anti-pattern warning
spring.jpa.open-in-view=false

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=Vaultix

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Use an env var in production; min 32 chars for HMAC-SHA256.
jwt.secret=${JWT_SECRET:Vaultix$ecretKeyForHMAC_SHA256_MinLen32!}
# Access token: 15 minutes (900 000 ms)
jwt.access-token-expiration-ms=${JWT_ACCESS_EXP_MS:900000}
# Refresh token: 7 days (seconds stored in DB as Instant)
jwt.refresh-token-expiration-days=${JWT_REFRESH_EXP_DAYS:7}